name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/pubg_tracker_ci
  DISCORD_TOKEN: ci-discord-token
  DISCORD_CLIENT_ID: ci-discord-client-id
  DISCORD_CHANNEL_ID: ci-discord-channel-id
  PUBG_API_KEY: ci-pubg-api-key

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pubg_tracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pubg_tracker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --runInBand --silent

      - name: Run integration tests
        run: npm run test:integration -- --runInBand --silent

      - name: Build
        run: npm run build

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
